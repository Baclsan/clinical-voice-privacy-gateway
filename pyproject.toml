[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical-voice-privacy-gateway"
version = "0.1.0"
description = "Local-first privacy boundary primitives for clinical voice AI workflows."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "License pending provenance review" }
authors = [{ name = "Clinical Voice Privacy Gateway contributors" }]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
